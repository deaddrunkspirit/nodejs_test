version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: user-auth-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodejs_test_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-auth-app-test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=test
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=nodejs_test_test
    volumes:
      - .:/app
      - /app/node_modules
    command: npm test

volumes:
  postgres_test_data: 